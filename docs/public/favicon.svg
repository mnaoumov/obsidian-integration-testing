<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Obsidian Integration Testing">
  <defs>
    <clipPath id="flask-inside">
      <path d="M13.4 4.6 v6.8 L7.1 23.2 a2.9 2.9 0 0 0 2.5 4.3 h12.8 a2.9 2.9 0 0 0 2.5 -4.3 L18.6 11.4 V4.6 z" />
    </clipPath>
  </defs>

  <!-- flask body -->
  <path d="M13.4 4.6 v6.8 L7.1 23.2 a2.9 2.9 0 0 0 2.5 4.3 h12.8 a2.9 2.9 0 0 0 2.5 -4.3 L18.6 11.4 V4.6 z"
    fill="#f4f2fd" stroke="#4c4470" stroke-width="1.2" stroke-linejoin="round" />

  <!-- reagent: two-tone violet, with a lighter meniscus and rising bubbles -->
  <g clip-path="url(#flask-inside)">
    <rect x="4" y="18.4" width="24" height="10" fill="#8b5cf6" />
    <rect x="4" y="18.4" width="24" height="1.1" fill="#c4b5fd" />
    <circle cx="11.8" cy="22.4" r="1.15" fill="#c4b5fd" opacity="0.85" />
    <circle cx="15.2" cy="25.3" r="0.8" fill="#c4b5fd" opacity="0.6" />
    <circle cx="13.9" cy="20.4" r="0.6" fill="#ddd6fe" opacity="0.7" />
  </g>

  <!-- neck rim -->
  <path d="M12.1 4 h7.8" stroke="#4c4470" stroke-width="1.7" stroke-linecap="round" />

  <!-- pass badge -->
  <circle cx="23.4" cy="23.4" r="7.1" fill="#f4f2fd" />
  <circle cx="23.4" cy="23.4" r="5.9" fill="#0f9d3a" />
  <path d="M20.5 23.6 l2.2 2.2 4.1 -4.8" fill="none" stroke="#ffffff" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round" />
</svg>
