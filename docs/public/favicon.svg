<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Obsidian Integration Testing">
  <defs>
    <clipPath id="screen">
      <rect x="7.9" y="4.1" width="16.2" height="11.6" rx="1.1" />
    </clipPath>
  </defs>

  <!-- laptop deck (MacBook silver) -->
  <path d="M6.6 16.6 H25.4 L28.7 25.3 q0.5 1.3 -0.9 1.3 H4.2 q-1.4 0 -0.9 -1.3 Z" fill="#c7cbd1" />
  <!-- keyboard keys -->
  <g fill="#8f949c">
    <rect x="9.3" y="18" width="1.5" height="1.05" rx="0.25" /><rect x="11.2" y="18" width="1.5" height="1.05" rx="0.25" /><rect x="13.1" y="18" width="1.5" height="1.05" rx="0.25" /><rect x="15" y="18" width="1.5" height="1.05" rx="0.25" /><rect x="16.9" y="18" width="1.5" height="1.05" rx="0.25" /><rect x="18.8" y="18" width="1.5" height="1.05" rx="0.25" /><rect x="20.7" y="18" width="1.5" height="1.05" rx="0.25" />
    <rect x="9.1" y="19.6" width="1.5" height="1.05" rx="0.25" /><rect x="11" y="19.6" width="1.5" height="1.05" rx="0.25" /><rect x="12.9" y="19.6" width="1.5" height="1.05" rx="0.25" /><rect x="14.8" y="19.6" width="1.5" height="1.05" rx="0.25" /><rect x="16.7" y="19.6" width="1.5" height="1.05" rx="0.25" /><rect x="18.6" y="19.6" width="1.5" height="1.05" rx="0.25" /><rect x="20.5" y="19.6" width="1.5" height="1.05" rx="0.25" />
    <rect x="8.9" y="21.2" width="1.5" height="1.05" rx="0.25" /><rect x="10.8" y="21.2" width="1.5" height="1.05" rx="0.25" /><rect x="12.7" y="21.2" width="1.5" height="1.05" rx="0.25" /><rect x="14.6" y="21.2" width="1.5" height="1.05" rx="0.25" /><rect x="16.5" y="21.2" width="1.5" height="1.05" rx="0.25" /><rect x="18.4" y="21.2" width="1.5" height="1.05" rx="0.25" /><rect x="20.3" y="21.2" width="1.5" height="1.05" rx="0.25" />
  </g>
  <!-- touchpad -->
  <rect x="12.7" y="23" width="6.6" height="2.1" rx="0.5" fill="#bcc1c8" stroke="#9aa0a8" stroke-width="0.35" />

  <!-- laptop screen -->
  <rect x="6.8" y="3.1" width="18.4" height="13.6" rx="2" fill="#04120a" stroke="#c7cbd1" stroke-width="1.6" />
  <!-- a passing test run: three green checks against their (dimmed) test names -->
  <g clip-path="url(#screen)">
    <g fill="#0CC40C">
      <path d="M9.2 6.3 L10 7.1 L11.6 5.2 L12.3 5.9 L10 8.6 L8.5 7 Z" />
      <path d="M9.2 10.1 L10 10.9 L11.6 9 L12.3 9.7 L10 12.4 L8.5 10.8 Z" />
    </g>
    <path d="M9.2 13.9 L10 14.7 L11.6 12.8 L12.3 13.5 L10 16.2 L8.5 14.6 Z" fill="#d4ffdd" />
    <g fill="#056C03">
      <rect x="13.4" y="6.3" width="9.4" height="1.2" rx="0.6" />
      <rect x="13.4" y="10.1" width="7.6" height="1.2" rx="0.6" />
      <rect x="13.4" y="13.9" width="8.6" height="1.2" rx="0.6" />
    </g>
  </g>
  <!-- Obsidian gem on top, two-tone violet -->
  <path d="M16 5.4 L12.1 9 L14.7 14.8 L16 14.8 Z" fill="#c4b5fd" fill-opacity="0.55" />
  <path d="M16 5.4 L19.9 9 L17.3 14.8 L16 14.8 Z" fill="#8b5cf6" fill-opacity="0.55" />
</svg>
