name: Refresh Metadata

# Runs npm run refresh:metadata (scripts/metadata/refresh-metadata.ts): refreshes the repo-root
# metadata.json from Obsidian's own endpoints (the obsidian-releases GitHub releases, the
# changelog feed, desktop-releases.json and each new version's asar). The script is
# byte-stable, so this commits ONLY when a source actually changed. Daily so new Obsidian
# releases land in the catalog within a day; also manual (workflow_dispatch).

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the refreshed metadata.json to main

concurrency: # never overlap two refresh runs
  group: refresh-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Save the catalog before the refresh
        run: cp metadata.json "$RUNNER_TEMP/metadata-before.json"

      - name: Refresh metadata.json
        run: npm run refresh:metadata
        env:
          # The anonymous releases API quota (60/hour) is shared by every job on the runner's IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- metadata.json; then
            echo "metadata.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata.json
          git commit -m "chore: refresh metadata.json"
          git push

      # A version that gained a public or catalyst channel (a new key, or a catalyst build that went public) gets an
      # `obsidian-release` dispatch to obsidian-lib, whose workaround canaries then run within minutes instead of at
      # their next daily run. A changelog or download edit changes no channel, so it sends nothing. The job's
      # GITHUB_TOKEN cannot dispatch into another repository, so this needs OBSIDIAN_LIB_DISPATCH_TOKEN, a
      # fine-grained token with Contents: read and write on mnaoumov/obsidian-lib; without it the step only warns.
      - name: Tell obsidian-lib about new Obsidian versions
        env:
          GH_TOKEN: ${{ secrets.OBSIDIAN_LIB_DISPATCH_TOKEN }}
        run: |
          versions=$(npm run --silent list:new-release-versions -- --before "$RUNNER_TEMP/metadata-before.json")
          if [ -z "$versions" ]; then
            echo "No new public or catalyst Obsidian version."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::New Obsidian version(s) $(echo $versions), but OBSIDIAN_LIB_DISPATCH_TOKEN is not set, so obsidian-lib was not told."
            exit 0
          fi
          for version in $versions; do
            gh api repos/mnaoumov/obsidian-lib/dispatches -f event_type=obsidian-release -f "client_payload[version]=$version"
            echo "Sent obsidian-lib an obsidian-release dispatch for $version."
          done
